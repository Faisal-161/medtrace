name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Eval quality gate
        run: |
          python -m medtrace.cli ingest data/sample
          python -m medtrace.cli eval --out eval/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json

  deploy:
    # Optional: ship the demo to Hugging Face Spaces after tests pass on main.
    # Docker Spaces need a Hugging Face PRO plan. To turn this on, set the repo variable HF_DEPLOY=true
    # and the secret HF_TOKEN. The free demo runs on Streamlit Community Cloud instead.
    needs: test
    if: vars.HF_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.24"
      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/deploy_space.py
