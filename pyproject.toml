[project]
name = "medtrace"
version = "0.1.0"
description = "Citation-grounded medical RAG that abstains when evidence is weak"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Faisal Islam", email = "faisalislam1610@gmail.com" }]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pypdf>=4.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
ui = ["streamlit>=1.33"]
models = ["sentence-transformers>=3.0", "anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
medtrace = "medtrace.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medtrace*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
